<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>InfoLoom — Furniture Catalog Handbook v5</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#F5F3EF;--bg2:#fff;--bg3:#FAFAF8;--bg4:#EDEBE6;
 --text:#1A1A1A;--text2:#5A5A5A;--text3:#9A9A9A;
 --accent:#1B4332;--accent2:#D4A853;--accent3:#2D6A4F;
 --blue:#2563EB;--blue-bg:#EFF6FF;--green:#15803D;--green-bg:#F0FDF4;
 --amber:#B45309;--amber-bg:#FFFBEB;--red:#DC2626;--red-bg:#FEF2F2;
 --teal:#0E7490;--teal-bg:#F0FDFA;--purple:#7C3AED;--purple-bg:#F5F3FF;--pink:#BE185D;--pink-bg:#FDF2F8;
 --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.15);
 --shadow:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 12px rgba(0,0,0,.09);--shadow-lg:0 10px 30px rgba(0,0,0,.13);
 --r:7px;--rl:11px;--rxl:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.topbar{background:var(--accent);color:#fff;position:sticky;top:0;z-index:400;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.topbar-inner{display:flex;align-items:center;height:52px;padding:0 18px}
.logo{display:flex;align-items:center;gap:10px;margin-right:14px;flex-shrink:0}
.logo-mark{width:32px;height:32px;background:var(--accent2);border-radius:7px;display:grid;place-items:center;font-size:16px}
.logo-text{font-size:13px;font-weight:800;line-height:1.1}
.logo-sub{font-size:9.5px;opacity:.6;font-weight:400}
.topbar-div{width:1px;height:26px;background:rgba(255,255,255,.16);margin-right:14px}
.nav-tabs{display:flex;height:52px;overflow-x:auto}
.nav-tabs::-webkit-scrollbar{display:none}
.ntab{padding:0 15px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.62);border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ntab:hover{color:#fff;background:rgba(255,255,255,.07)}
.ntab.active{color:#fff;border-bottom-color:var(--accent2);background:rgba(255,255,255,.1)}
.ntab .nb{font-size:9px;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:9px;font-weight:700}
.filterbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;position:sticky;top:52px;z-index:300}
.sw{position:relative;flex:1;max-width:360px}
.sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:2}
.sw input{width:100%;padding:7px 10px 7px 31px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);font-size:12.5px;outline:none}
.sw input:focus{border-color:var(--accent);background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--border2);background:var(--bg3);border-radius:20px;font-size:11.5px;font-weight:600;color:var(--text2);cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.statsbar{padding:8px 18px;font-size:11.5px;color:var(--text2);background:var(--bg3);border-bottom:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap}
.statsbar b{color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:22px 18px 70px}
.fade-in{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* hero */
.hero{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border-radius:var(--rxl);padding:32px 30px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;margin-bottom:22px}
.hero::after{content:"🛋️";position:absolute;right:-12px;bottom:-26px;font-size:150px;opacity:.09}
.hero-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:30px;font-size:11px;font-weight:600;margin-bottom:13px}
.hero h1{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-bottom:9px}
.hero p{font-size:13.5px;max-width:780px;opacity:.93;line-height:1.65}
.hero-stats{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.hs{}.hs b{display:block;font-size:23px;font-weight:800;color:var(--accent2)}.hs span{font-size:11px;opacity:.8}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.ov-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:17px 18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.ov-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border2)}
.ov-ic{font-size:24px;margin-bottom:9px}
.ov-card h3{font-size:14.5px;font-weight:700;margin-bottom:5px}
.ov-card p{font-size:12px;color:var(--text2);line-height:1.55}

/* category accordion */
.cat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rxl);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.cat-hdr{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;transition:.12s}
.cat-hdr:hover{background:var(--bg3)}
.cat-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.cat-name{font-size:17px;font-weight:800}
.cat-meta{font-size:11.5px;color:var(--text3);margin-top:2px;display:flex;gap:8px;align-items:center}
.cat-chev{width:20px;height:20px;stroke:var(--text3);fill:none;stroke-width:2.4;margin-left:auto;transition:.2s}
.cat-chev.open{transform:rotate(180deg)}
.cat-body{display:none;border-top:1px solid var(--border)}
.cat-body.open{display:block}
.sub-tabs{display:flex;gap:0;overflow-x:auto;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.sub-tabs::-webkit-scrollbar{height:5px}.sub-tabs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.stb{padding:11px 13px;font-size:12px;font-weight:600;color:var(--text2);background:transparent;border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
.stb:hover{color:var(--text)}
.stb.active{color:var(--text)}
.stb .stb-n{font-size:9px;color:var(--text3);margin-left:4px}
.spanel{padding:18px 18px 22px}
.ssc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:13px}
.ssc-card{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;background:var(--bg2);box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column}
.ssc-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ssc-imgwrap{position:relative;aspect-ratio:4/3;background:var(--bg4);overflow:hidden}
.ssc-imgwrap img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.ssc-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:var(--text3);background:repeating-linear-gradient(45deg,var(--bg4),var(--bg4) 10px,#e7e4de 10px,#e7e4de 20px)}
.ssc-badge{position:absolute;top:7px;right:7px;font-size:8px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:20px;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.b-real{background:var(--green)}.b-rep{background:var(--teal)}.b-wait{background:var(--amber)}
.ssc-meta{padding:9px 11px 11px;flex:1;display:flex;flex-direction:column;gap:4px}
.ssc-n{font-size:12.5px;font-weight:700;line-height:1.3}
.ssc-src{font-size:10px;color:var(--text3);font-family:ui-monospace,Menlo,monospace;margin-top:auto}
.ssc-src b{color:var(--accent3);font-family:inherit}
.addimg{display:flex;gap:5px;margin-top:6px}
.addimg input{flex:1;min-width:0;font-size:10px;padding:4px 6px;border:1px solid var(--border2);border-radius:5px;outline:none}
.addimg button{font-size:10px;font-weight:700;padding:4px 8px;border:none;border-radius:5px;background:var(--accent);color:#fff;cursor:pointer}
.sub-note{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:var(--r);padding:10px 13px;font-size:12px;color:var(--text2);margin-bottom:14px}

/* attribute columns */
.col-intro{background:var(--blue-bg);border:1px solid rgba(37,99,235,.18);border-radius:var(--rl);padding:14px 16px;font-size:12.5px;color:#1e3a8a;margin-bottom:16px;line-height:1.6}
.col-sec{margin-bottom:18px}
.col-sec-h{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;padding:8px 0;border-bottom:2px solid var(--border);margin-bottom:11px}
.col-sec-dot{width:11px;height:11px;border-radius:3px}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}
.col-card{border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;background:var(--bg2);box-shadow:var(--shadow)}
.col-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.col-n{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;color:var(--accent)}
.col-type{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.t-text{background:var(--blue-bg);color:var(--blue)}.t-num{background:var(--green-bg);color:var(--green)}.t-enum{background:var(--purple-bg);color:var(--purple)}
.t-bool{background:var(--amber-bg);color:var(--amber)}.t-url{background:var(--teal-bg);color:var(--teal)}.t-date{background:var(--pink-bg);color:var(--pink)}
.col-req{font-size:8.5px;font-weight:800;background:var(--red);color:#fff;padding:2px 6px;border-radius:5px}
.col-desc{font-size:11.5px;color:var(--text2);line-height:1.5;margin-bottom:7px}
.col-sample{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 8px;white-space:pre-line;line-height:1.5;max-height:84px;overflow:auto}
.col-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.col-tag{font-size:9.5px;background:var(--bg4);color:var(--text2);padding:2px 7px;border-radius:12px}

/* vendors */
.vbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{font-size:12.5px;font-weight:700;padding:8px 15px;border:none;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn-pri{background:var(--accent);color:#fff}.btn-pri:hover{background:var(--accent3)}
.btn-sec{background:var(--bg2);color:var(--text);border:1px solid var(--border2)}.btn-sec:hover{border-color:var(--accent)}
.vtable{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow)}
.vtable th{background:var(--bg4);text-align:left;padding:10px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:800;position:sticky;top:0}
.vtable td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top}
.vtable tr:hover td{background:var(--bg3)}
.vbrand{font-weight:700;color:var(--text)}
.cchip{display:inline-block;font-size:10px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:12px;margin:2px 3px 2px 0;font-weight:600}
.cchip.note{background:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:600;padding:20px}
.modal-bg.show{display:grid}
.modal{background:#fff;border-radius:var(--rxl);max-width:520px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.modal-x{cursor:pointer;font-size:20px;color:var(--text3);background:none;border:none}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;margin-bottom:5px;color:var(--text2)}
.fld input[type=text]{width:100%;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;outline:none}
.fld input:focus{border-color:var(--accent)}
.clbox{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:4px}
.clpick{font-size:11px;padding:5px 10px;border:1px solid var(--border2);border-radius:16px;background:var(--bg3);cursor:pointer;user-select:none}
.clpick.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:11px 20px;border-radius:30px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:700;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

/* workflow */
.flow-hero{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border-radius:var(--rxl);padding:28px 28px;box-shadow:var(--shadow-lg);margin-bottom:8px;position:relative;overflow:hidden}
.flow-hero::after{content:"🔄";position:absolute;right:-8px;bottom:-20px;font-size:120px;opacity:.1}
.flow-hero h1{font-size:24px;font-weight:800;margin-bottom:8px}
.flow-hero p{font-size:13px;max-width:770px;opacity:.93;line-height:1.6}
.fc-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rxl);padding:20px;margin:18px 0;box-shadow:var(--shadow);overflow-x:auto}
.fc-wrap svg{display:block;margin:0 auto;min-width:760px}
.stage{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rxl);margin-top:20px;overflow:hidden;box-shadow:var(--shadow)}
.stage-hdr{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--border);border-left:5px solid var(--accent)}
.stage-ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff;flex-shrink:0}
.sh-k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text3)}
.sh-t{font-size:19px;font-weight:800;margin-top:1px}
.sh-d{font-size:12px;color:var(--text2);margin-top:4px;max-width:740px;line-height:1.55}
.stage-body{padding:20px 22px}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.io-box{border:1px solid var(--border);border-radius:var(--rl);padding:13px 15px;background:var(--bg3)}
.io-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;gap:6px}
.io-in .io-h{color:var(--blue)}.io-out .io-h{color:var(--green)}
.io-box ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.io-box li{font-size:12px;color:var(--text2);padding-left:15px;position:relative;line-height:1.5}
.io-box li::before{content:"▸";position:absolute;left:0;color:var(--text3)}
.io-box li b{color:var(--text)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:4px 0 16px}
.step{display:flex;gap:12px;align-items:flex-start}
.step-n{counter-increment:s;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.step-n::before{content:counter(s)}
.step-c{font-size:12.5px;line-height:1.55;color:var(--text2);padding-top:2px}
.step-c b{color:var(--text)}
.step-c code{background:var(--bg4);border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--accent)}
.iss-h{font-size:13px;font-weight:800;margin:14px 0 9px;display:flex;gap:7px}
.iss-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.iss-table th{background:var(--bg4);text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:800}
.iss-table td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top;line-height:1.5;color:var(--text2)}
.iss-table tr:nth-child(even) td{background:var(--bg3)}
.iss-table td b{color:var(--text)}
.iss-table code{background:#fff;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--accent)}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#fff;background:var(--red);padding:2px 6px;border-radius:5px;white-space:nowrap;display:inline-block}
.callout{display:flex;gap:11px;align-items:flex-start;border-radius:var(--rl);padding:13px 16px;margin:14px 0;font-size:12.5px;line-height:1.6}
.callout .ci{font-size:18px;flex-shrink:0}
.c-gold{background:var(--amber-bg);border:1px solid rgba(180,83,9,.22);color:#7a4a08}
.c-green{background:var(--green-bg);border:1px solid rgba(21,128,61,.22);color:#14532d}
.c-red{background:var(--red-bg);border:1px solid rgba(220,38,38,.22);color:#991b1b}
.callout b{font-weight:700}.callout code{background:#fff;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.flow-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px;color:var(--text3);margin:30px 0 2px;display:flex;align-items:center;gap:10px}
.flow-sec::before,.flow-sec::after{content:"";height:1px;background:var(--border2);flex:1}
.dtree{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rxl);padding:18px 22px;margin-top:18px;box-shadow:var(--shadow)}
.dtree h3{font-size:14.5px;font-weight:800;margin-bottom:13px}
.dt-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px}
.dt-q{background:var(--blue-bg);border:1px solid rgba(37,99,235,.25);color:#1e40af;padding:6px 11px;border-radius:8px;font-weight:600}
.dt-a{background:#fff;border:1px solid var(--border2);padding:5px 10px;border-radius:8px;color:var(--text2)}
.dt-r{background:var(--green-bg);border:1px solid rgba(21,128,61,.25);color:var(--green);padding:5px 10px;border-radius:8px;font-weight:600}
.dt-ar{color:var(--text3);font-weight:700}
.ex-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rxl);margin-top:18px;overflow:hidden;box-shadow:var(--shadow)}
.ex-hdr{padding:15px 22px;background:linear-gradient(90deg,var(--purple-bg),transparent);border-left:5px solid var(--purple)}
.ex-hdr .eh-t{font-size:16px;font-weight:800}.ex-hdr .eh-d{font-size:12px;color:var(--text2);margin-top:3px}
.ex-cols{display:grid;grid-template-columns:1fr 1fr}
.ex-col{padding:16px 20px}
.ex-raw{background:#1e1e1e;color:#d4d4d4}
.ex-raw .ec-h{color:#9cdcfe}.ex-out .ec-h{color:var(--green)}
.ec-h{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;margin-bottom:11px}
.ex-raw pre{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ex-raw .tg{color:#569cd6}.ex-raw .tk{color:#ce9178}.ex-raw .dm{color:#b5cea8}
.ex-map{width:100%;border-collapse:collapse;font-size:11.5px}
.ex-map td{padding:5px 8px;border-top:1px solid var(--border);vertical-align:top}
.ex-map td:first-child{font-family:ui-monospace,Menlo,monospace;color:var(--accent);font-weight:600;white-space:nowrap;width:44%}
@media(max-width:760px){.io-grid,.ex-cols{grid-template-columns:1fr}.ssc-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
#logo_infoloom{
  width: 120px;
  height: 30px;
}

</div>

let tab="intro", q="", chip="All", subState={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
let customImgs=LS.get("il_imgs",{});
let userVendors=LS.get("il_vendors",[]);
let userClients=LS.get("il_clients",[]);
function allVendors(){return userVendors.concat(VENDORS);}
function allClients(){return Array.from(new Set(userClients.concat(CLIENTS))).sort();}
function imgFor(c,s,ss){const k=c+"||"+s+"||"+ss;return customImgs[k]||null;}

/* ===== HELPERS ===== */
function esc(x){return (x==null?"":(""+x)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function id(c){return c.replace(/[^a-zA-Z0-9]/g,"-");}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function updateStats(html){document.getElementById("statsbar").innerHTML=html;}

/* ===== TAB SWITCH ===== */
function switchTab(t){
  tab=t;q="";chip="All";document.getElementById("searchInput").value="";
  const names=["intro","taxo","cols","vendors","flow"];
  document.querySelectorAll(".ntab").forEach((b,i)=>b.classList.toggle("active",names[i]===t));
  ["introView","taxoView","colsView","vendorsView","flowView"].forEach((v,i)=>
    document.getElementById(v).style.display=(names[i]===t?"block":"none"));
  document.getElementById("filterbar").style.display=(t==="cols"||t==="vendors"||t==="taxo")?"flex":"none";
  buildChips();render();
}
function buildChips(){
  const row=document.getElementById("chips");row.innerHTML="";let opts=[];
  if(tab==="taxo")opts=["All"].concat(TAXO.map(c=>c.name));
  else if(tab==="cols")opts=["All","Required","Text","Number","Enum","Boolean","URL","Date"];
  else if(tab==="vendors")opts=["All"].concat(allClients());
  opts.forEach(o=>{const b=document.createElement("button");b.className="chip"+(o===chip?" on":"");
    b.textContent=o;b.onclick=()=>{chip=o;buildChips();render();};row.appendChild(b);});
  document.getElementById("searchInput").placeholder=
    tab==="taxo"?"Search sub-categories…":tab==="cols"?"Search column, description…":tab==="vendors"?"Search brand or client…":"Search…";

/* ===== CATEGORY TAXONOMY ===== */
function renderTaxo(){
  let cats=TAXO.filter(c=>chip==="All"||c.name===chip);
  let totalSS=0;TAXO.forEach(c=>c.subs.forEach(s=>totalSS+=s.ss.length));
  if(q){
    // search mode: flat list of matching subsubs
    let hits=[];
    TAXO.forEach(c=>c.subs.forEach(s=>s.ss.forEach(x=>{
      if((c.name+" "+s.name+" "+x.n).toLowerCase().includes(q)) hits.push({c,s,x});
    })));
    updateStats('<span><b>'+hits.length+'</b> matches for "'+esc(q)+'"</span>');
    document.getElementById("taxoView").innerHTML='<div class="ssc-grid fade-in">'+hits.slice(0,300).map(h=>sscCard(h.c,h.s,h.x)).join("")+'</div>'+(hits.length>300?'<p style="margin-top:14px;color:var(--text3);font-size:12px">Showing first 300 — refine your search.</p>':"");
    return;
  }
  let shownSS=0;cats.forEach(c=>c.subs.forEach(s=>shownSS+=s.ss.length));
  updateStats('<span><b>'+cats.length+'</b> categories</span><span><b>'+shownSS+'</b> sub-categories shown</span><span>of <b>'+totalSS+'</b> total</span>');
  document.getElementById("taxoView").innerHTML='<div class="fade-in">'+cats.map(catCard).join("")+'</div>';
}
function catCard(c){
  const cid="cat-"+id(c.name);
  let nss=0;c.subs.forEach(s=>nss+=s.ss.length);
  const open=subState[cid+"_open"];
  return`<div class="cat-card" id="${cid}">
    <div class="cat-hdr" onclick="toggleCat('${cid}')">
      <div class="cat-ico" style="background:${c.bg}">${c.icon}</div>
      <div><div class="cat-name">${c.name}</div>
        <div class="cat-meta"><span style="color:${c.color};font-weight:700">${c.subs.length} sub-categories</span><span>·</span><span>${nss} types</span></div></div>
      <svg class="cat-chev${open?' open':''}" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="cat-body${open?' open':''}" id="${cid}-body">${open?catInner(c):""}</div>
  </div>`;
}
function catInner(c){
  const cid="cat-"+id(c.name);
  const sel=subState[cid]||0;
  return`<div class="sub-tabs">${c.subs.map((s,i)=>`<button class="stb${i===sel?' active':''}" style="${i===sel?'border-bottom-color:'+c.color+';color:'+c.color:''}" onclick="selSub('${cid}',${i},'${c.color}')">${esc(s.name)}<span class="stb-n">${s.ss.length}</span></button>`).join("")}</div>
    <div class="spanel" id="${cid}-sp">${subPanel(c,c.subs[sel])}</div>`;
}
function subPanel(c,s){
  const real=s.ss.filter(x=>x.u||imgFor(c.name,s.name,x.n)).length;
  return`<div class="sub-note"><b>${esc(s.name)}</b> — ${s.ss.length} sub-sub-categories · ${real} with a product image.</div>
    <div class="ssc-grid">${s.ss.map(x=>sscCard(c,s,x)).join("")}</div>`;
}
function sscCard(c,s,x){
  const custom=imgFor(c.name,s.name,x.n);
  const url=custom||x.u;
  const key=esc(c.name+"||"+s.name+"||"+x.n);
  let badge,src,img;
  if(url){
    const b=custom?"YOURS":(x.q==="repr"?"REPR":"REAL");
    const cls=custom?"b-real":(x.q==="repr"?"b-rep":"b-real");
    badge=`<span class="ssc-badge ${cls}">${b}</span>`;
    img=`<img loading="lazy" src="${esc(url)}" alt="${esc(x.n)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="ssc-ph" style="display:none">${c.icon}</div>`;
    src=custom?`<div class="ssc-src">📷 <b>added by you</b></div>`:`<div class="ssc-src">📷 <b>${esc(x.b)}</b> · ${esc(x.k)}</div>`;
  }else{
    badge=`<span class="ssc-badge b-wait">AWAITING</span>`;
    img=`<div class="ssc-ph">${c.icon}</div>`;
    src=`<div class="ssc-src">no vendor image yet</div>
      <div class="addimg"><input type="text" placeholder="paste image URL" id="ai-${key}"><button onclick="addImg('${key}')">＋</button></div>`;
  }
  return`<div class="ssc-card"><div class="ssc-imgwrap">${img}${badge}</div>
    <div class="ssc-meta"><div class="ssc-n">${esc(x.n)}</div>${src}</div></div>`;
}
function toggleCat(cid){const k=cid+"_open";subState[k]=!subState[k];renderTaxo();}
function selSub(cid,i,color){subState[cid]=i;const c=TAXO.find(x=>"cat-"+id(x.name)===cid);
  document.getElementById(cid+"-sp").innerHTML=subPanel(c,c.subs[i]);
  document.querySelectorAll("#"+cid+" .stb").forEach((b,j)=>{b.classList.toggle("active",j===i);b.style.borderBottomColor=j===i?color:"";b.style.color=j===i?color:"";});}
function addImg(key){const inp=document.getElementById("ai-"+key);const v=(inp.value||"").trim();
  if(!/^https?:\/\//.test(v)){toast("Enter a valid http(s) image URL");return;}
  customImgs[key]=v;LS.set("il_imgs",customImgs);toast("Image saved on this device");renderTaxo();}

/* ===== MASTER ATTRIBUTES ===== */
function renderCols(){
  let total=0,shown=0;SECTIONS.forEach(s=>total+=s.cols.length);
  const blocks=SECTIONS.map(sec=>{
    let cols=sec.cols.filter(col=>{
      const tm=chip==="All"||(chip==="Required"&&col.req)||(chip==="Text"&&col.type==="text")||(chip==="Number"&&col.type==="num")||(chip==="Enum"&&col.type==="enum")||(chip==="Boolean"&&col.type==="bool")||(chip==="URL"&&col.type==="url")||(chip==="Date"&&col.type==="date");
      const qm=!q||(col.n+" "+col.desc+" "+(col.tags||[]).join(" ")).toLowerCase().includes(q);
      return tm&&qm;
    });
    shown+=cols.length;
    if(!cols.length)return"";
    return`<div class="col-sec"><div class="col-sec-h"><span class="col-sec-dot" style="background:${sec.color}"></span>${esc(sec.title)} <span style="color:var(--text3);font-weight:600;font-size:11px">(${cols.length})</span></div>
      <div class="col-grid">${cols.map(col=>`
        <div class="col-card"><div class="col-top"><span class="col-n">${esc(col.n)}</span><span class="col-type ${TYPE_CLS[col.type]||'t-text'}">${col.type}</span>${col.req?'<span class="col-req">REQ</span>':''}</div>
          <div class="col-desc">${esc(col.desc)}</div>
          <div class="col-sample">${esc(col.sample)}</div>
          <div class="col-tags">${(col.tags||[]).map(t=>`<span class="col-tag">${esc(t)}</span>`).join("")}</div>
        </div>`).join("")}</div></div>`;
  }).join("");
  updateStats('<span><b>'+shown+'</b> of <b>'+total+'</b> columns</span><span>'+SECTIONS.length+' groups</span>');
  document.getElementById("colsView").innerHTML='<div class="col-intro fade-in">The <b>94-column master template</b> is the single output schema every vendor record is mapped into. Required (<b>REQ</b>) fields must be present before import. Watch header casing — the importer matches names exactly.</div>'+blocks;
}

  const vs=allVendors().filter(v=>{
    if(chip!=="All"&&!v.c.some(x=>x.toLowerCase().startsWith(chip.toLowerCase())))return false;
    if(q&&!(v.b.toLowerCase().includes(q)||v.c.join(" ").toLowerCase().includes(q)))return false;
    return true;
  });
  document.getElementById("nb-vend").textContent=allVendors().length;
  updateStats('<span><b>'+vs.length+'</b> brands shown</span><span><b>'+allClients().length+'</b> clients</span><span>tap a client chip above to filter</span>');

}

function openVendorModal(){
  pickClients=new Set();

  document.getElementById("modalBody").innerHTML=`

  const n=(document.getElementById("vName").value||"").trim();

  userVendors.unshift({b:n,c:Array.from(pickClients),new:true});

function openClientModal(){
  document.getElementById("modalTitle").textContent="Add Retail Client";

  document.getElementById("modalFoot").innerHTML=`<button class="btn btn-sec" onclick="closeModal()">Cancel</button><button class="btn btn-pri" onclick="saveClient()">Save Client</button>`;
  document.getElementById("modalBg").classList.add("show");
}
function saveClient(){
  const n=(document.getElementById("cName").value||"").trim().toLowerCase().replace(/\s+/g,"");

  if(allClients().includes(n)){toast("Client already exists");return;}
  userClients.push(n);LS.set("il_clients",userClients);closeModal();toast("Client added");buildChips();renderVendors();
}

function stageScrape(){return `
  <div class="flow-sec">Stage 1 — acquire the data</div>
  <div class="stage">
    <div class="stage-hdr" style="border-left-color:#2563EB"><div class="stage-ico" style="background:#2563EB">🕸️</div>
      <div><div class="sh-k">Stage 1</div><div class="sh-t">Scraping</div>
      <div class="sh-d">Get product data out of the vendor's world into a working file. Data arrives either <b>semi-structured</b> (already in columns, like Liberty) or <b>raw HTML/text</b> (like Flexsteel) where everything must be extracted later. Your job here is to capture <b>everything</b> faithfully and lose nothing.</div></div></div>
    <div class="stage-body">
      <div class="io-grid">
        <div class="io-box io-in"><div class="io-h">📥 Sources</div><ul>
          <li><b>Vendor website</b> — product detail pages (PDP)</li>
          <li><b>CSV / XML / JSON feed</b> or dealer-portal export</li>
          <li><b>Sitemap</b> to discover every product URL</li>
          <li><b>ZIP image pack</b> supplied by the vendor</li></ul></div>
        <div class="io-box io-out"><div class="io-h">📤 Outputs</div><ul>
          <li><b>Raw file saved untouched</b> + a working copy</li>
          <li><b>source_url</b> kept on every row (traceability)</li>
          <li>Captured: title, SKU, brand, breadcrumb, price, <b>raw HTML/text</b></li>
          <li><b>Image URLs</b> (main + gallery) or filenames to resolve later</li>
          <li>An <b>intake note</b>: row count, columns, format, oddities</li></ul></div>
      </div>
      <div class="steps">
        <div class="step"><div class="step-n"></div><div class="step-c">Create a folder <code>Client / Brand / Date</code>. Save the raw file <b>with no edits</b> — this is your safety net.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Identify the key fields you must capture: <b>SKU, title, brand, breadcrumb/category, description, dimensions, price, image fields, variant fields</b>.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Keep the <code>source_url</code> per product so any value can be traced back and re-checked. If the page is JavaScript-rendered, capture the rendered <b>text</b> and the spec <code>&lt;div&gt;</code> blocks, not just the bare markup.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Record row count, column count, source domain and format. Flag anything unusual <b>before</b> any cleanup begins.</div></div>
      </div>
      <div class="callout c-gold"><span class="ci">🔑</span><div>Don't normalise while scraping. If a dimension reads <code>W38 x D17 x H37</code>, store that exact string. Re-formatting happens in Stage 2 &amp; 3, where it's reversible.</div></div>
      <div class="iss-h">⚠️ Common scraping issues &amp; fixes</div>
      <table class="iss-table"><thead><tr><th style="width:24%">Issue</th><th style="width:30%">Why</th><th>Fix</th></tr></thead><tbody>
        <tr><td><b>Empty / partial page</b></td><td>Content rendered by JavaScript; raw HTML is mostly scripts</td><td>Capture rendered text + the "Dimensions"/"Other" tab blocks — that's where real specs live (the Flexsteel case).</td></tr>
        <tr><td><b>Missing images</b></td><td>Lazy-loaded, behind a CDN, or stored as filenames only</td><td>Grab the full <code>srcset</code>/CDN URL; if only filenames exist, resolve them against the vendor image-host pattern in Stage 3.</td></tr>
        <tr><td><b>Blocked / rate-limited</b></td><td>Too many fast requests; bot protection</td><td>Slow the crawl, reuse a session; if blocked, switch to the vendor feed and escalate to the developer.</td></tr>
        <tr><td><b>Duplicate SKUs across pages</b></td><td>Listed under several categories or as variants</td><td>Keep all rows for now with their source category; resolve in QA. <span class="rc">duplicate_sku</span></td></tr>
        <tr><td><b>Inconsistent dimension text</b></td><td>Every vendor writes sizes differently</td><td>Preserve the raw string; normalise later.</td></tr>
      </tbody></table>
    </div>
  </div>`;}

function stageClean(){return `
  <div class="flow-sec">Stage 2 — make it clean</div>
  <div class="stage">
    <div class="stage-hdr" style="border-left-color:#0E7490"><div class="stage-ico" style="background:#0E7490">🧽</div>
      <div><div class="sh-k">Stage 2</div><div class="sh-t">Cleaning</div>
      <div class="sh-d">Turn messy source text into safe, consistent values — <b>without inventing facts or deleting meaning</b>. Broken HTML, odd encodings and duplicate rows get tamed here so mapping can be confident.</div></div></div>
    <div class="stage-body">
      <div class="io-grid">
        <div class="io-box io-in"><div class="io-h">📥 Inputs</div><ul>
          <li>Working copy with raw fields</li>
          <li><b>HTML blobs</b>: <code>product_details_html</code>, <code>features_html</code></li>
          <li>Raw dimension &amp; weight strings</li>
          <li>Encoded chars: <code>&amp;amp;</code>, smart quotes, <code>″</code> inch marks</li></ul></div>
        <div class="io-box io-out"><div class="io-h">📤 Outputs</div><ul>
          <li>Readable descriptions &amp; clean bullet <b>features</b></li>
          <li>Trimmed, de-duplicated rows</li>
          <li><b>Raw specs preserved</b> in a backup field</li>
          <li>Consistent unit format, ready to split into columns</li></ul></div>
      </div>
      <div class="steps">
        <div class="step"><div class="step-n"></div><div class="step-c">Strip unsafe/broken HTML; convert <code>&lt;li&gt;</code> lists into clean feature bullets; keep only allowed formatting.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Fix encoding: <code>&amp;amp;</code>→<code>&amp;</code>, curly quotes → straight, normalise the inch mark.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Remove duplicate spaces, stray line breaks, hidden text.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Preserve the original dimension string in a <code>…_raw</code> field <b>before</b> you split it.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">De-duplicate rows — but treat duplicate SKUs with care (variant vs true dupe).</div></div>
      </div>
      <div class="callout c-red"><span class="ci">🚫</span><div><b>Never rewrite manufacturer facts.</b> Cleaning is formatting and de-junking — not adding marketing claims, guessing a material, or "improving" a measurement. If the vendor didn't state it, leave it blank and flag it.</div></div>
      <div class="iss-h">⚠️ Common cleaning issues &amp; fixes</div>
      <table class="iss-table"><thead><tr><th style="width:24%">Issue</th><th style="width:30%">Why</th><th>Fix</th></tr></thead><tbody>
        <tr><td><b>Broken HTML in fields</b></td><td>Copied straight from source with unclosed tags</td><td>Parse to clean text + list items; never paste <code>&lt;script&gt;</code> into product fields. <span class="rc">html_cleanup_needed</span></td></tr>
        <tr><td><b>Mojibake / odd symbols</b></td><td>Encoding mismatch; entities left raw</td><td>Decode entities, normalise to UTF-8, fix quotes &amp; inch marks.</td></tr>
        <tr><td><b>Keyword-stuffed title</b></td><td>Vendor crams category words into the name</td><td>Keep a natural Brand / Collection / Model name.</td></tr>
        <tr><td><b>Empty description</b></td><td>Weak vendor copy</td><td>Use a short factual description from specs; flag if missing rather than fabricating.</td></tr>
        <tr><td><b>Numbers mixed with text</b></td><td>"135 lbs.", "19.69 cu ft" in a numeric field</td><td>Split unit from number; keep numeric columns numeric. <span class="rc">invalid_data_type</span></td></tr>
      </tbody></table>
    </div>
  </div>`;}

function stageProcess(){return `
  <div class="flow-sec">Stage 3 — give it meaning, then publish</div>
  <div class="stage">
    <div class="stage-hdr" style="border-left-color:#7C3AED"><div class="stage-ico" style="background:#7C3AED">🗺️</div>
      <div><div class="sh-k">Stage 3</div><div class="sh-t">Processing &amp; PIM</div>
      <div class="sh-d">The heart of the job. Convert vendor categories into the <b>approved taxonomy</b>, pull every visible spec into the <b>standard attribute columns</b>, validate, then import into the <b>PIM</b> (Product Information Management system — the single source of truth that feeds the retailer's website) and confirm it live.</div></div></div>
    <div class="stage-body">
      <div class="io-grid">
        <div class="io-box io-in"><div class="io-h">📥 Inputs</div><ul>
          <li>Cleaned rows + breadcrumb + product context</li>
          <li>The <b>Category Mapping</b> dictionary (approved values)</li>
          <li>The <b>Attribute dictionary</b> + 94-column template</li>
          <li>Resolved image URLs</li></ul></div>
        <div class="io-box io-out"><div class="io-h">📤 Outputs</div><ul>
          <li><b>category → sub_category → subsub</b> using approved names only</li>
          <li>Normalised dimensions, seat/arm sizes, material, finish, color, style, motion_type…</li>
          <li><b>feature_img</b> + pipe-separated <b>product_img</b> gallery</li>
          <li>Validated, versioned <b>import-ready file</b> → live in PIM</li></ul></div>
      </div>
      <div class="iss-h" style="margin-top:4px">🗺️ Mapping &amp; extraction</div>
      <div class="steps">
        <div class="step"><div class="step-n"></div><div class="step-c">Read title + breadcrumb + image, then find the closest approved <code>category → subcategory → sub_subcategory</code>. Choose by <b>shopper intent</b>, not material.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Use exact approved spellings — never invent <code>Width</code> when <code>width</code> exists, or a new sub-category name.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Extract each labelled dimension into its own field (table size ≠ <code>seat_width</code>); read labels, not positions. Keep units consistent.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Resolve image filenames to full URLs; set one main <code>feature_img</code> + the rest pipe-separated in <code>product_img</code>.</div></div>
      </div>
      <div class="iss-h">🏛️ Validate → import → storefront QA</div>
      <div class="steps">
        <div class="step"><div class="step-n"></div><div class="step-c">Match headers to the template <b>exactly</b> (watch the <code>Finish</code> vs <code>finish</code> casing trap). Remove blank rows.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Run required-field checks (SKU, title, brand, category, image, source URL) and validate taxonomy spelling against the dictionary.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Decide each duplicate SKU (dupe / variant / multi-category). Save a versioned final file + change note, then <b>import into the PIM</b>.</div></div>
        <div class="step"><div class="step-n"></div><div class="step-c">Storefront QA: confirm PDP (title/SKU/brand/breadcrumb/images), PLP placement, search by name + SKU, filters/facets, and SEO basics (clean URL, title/meta, canonical). Log every issue with URL + SKU + screenshot.</div></div>
      </div>
      <div class="iss-h">⚠️ Common processing &amp; PIM issues &amp; fixes</div>
      <table class="iss-table"><thead><tr><th style="width:22%">Issue</th><th style="width:30%">Why</th><th>Fix</th></tr></thead><tbody>
        <tr><td><b>Ambiguous category</b></td><td>A bench could be Bedroom, Dining or Living Room</td><td>Use breadcrumb + intent; else "Needs Review". <span class="rc">category_unknown</span></td></tr>
        <tr><td><b>Vendor term not in taxonomy</b></td><td>Label has no approved match</td><td>Nearest approved value only if obvious; otherwise flag. Never invent a spelling.</td></tr>
        <tr><td><b>Dimension order flipped</b></td><td>W×D×H vs D×W×H vs H×W×L</td><td>Map each labelled value to its own field; don't assume order.</td></tr>
        <tr><td><b>Only filenames, no image</b></td><td>Column holds <code>brand_sku_large.jpg</code></td><td>Resolve against vendor host; if unresolvable, flag. <span class="rc">image_not_found</span></td></tr>
        <tr><td><b>Import rejected</b></td><td>Header mismatch or text in a numeric field</td><td>Align headers character-for-character; fix data types. <span class="rc">invalid_data_type</span></td></tr>
        <tr><td><b>Broken image / wrong breadcrumb on PDP</b></td><td>Bad URL or taxonomy spelling drift</td><td>Re-resolve URL; validate names against approved values — one new spelling breaks filters &amp; menus.</td></tr>
        <tr><td><b>Suspicious price</b></td><td>Missing/odd MAP/MSRP</td><td>Never change price manually; confirm first. <span class="rc">price_review_needed</span></td></tr>
      </tbody></table>
    </div>
  </div>`;}
